name: Windows Desktop

on:
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installer = "$env:TEMP\tailscale.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process $installer -ArgumentList "/quiet" -Wait

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TALESCALE_AUTH_KEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$env:TS_AUTHKEY"

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Show Tailscale IP
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "Windows runner is running"
          Write-Host "========================================="

          while ($true) {
            Start-Sleep -Seconds 60
          }
