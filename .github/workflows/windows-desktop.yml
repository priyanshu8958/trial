name: Windows Desktop RDP

on:
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TALESCALE_AUTH_KEY }}

      - name: Set runneradmin password
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          net user runneradmin "$env:RDP_PASSWORD"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to set runneradmin password."
          }

          Write-Host "runneradmin password set successfully."

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled."

      - name: Verify runneradmin
        shell: powershell
        run: |
          net user runneradmin

          Write-Host ""
          Write-Host "RDP username: runneradmin"

      - name: Show Tailscale information
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "TAILSCALE IP"
          Write-Host "=========================================="

          tailscale ip -4

          Write-Host ""
          Write-Host "TAILSCALE STATUS"
          Write-Host "=========================================="

          tailscale status

      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP SERVER READY"
          Write-Host "Username: runneradmin"
          Write-Host "Use the Tailscale IPv4 address above."
          Write-Host "=========================================="

          while ($true) {
            Start-Sleep -Seconds 60
          }
